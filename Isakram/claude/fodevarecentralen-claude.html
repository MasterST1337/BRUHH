<title>Fødevarecentralen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Isakram-farveprofilen fra designudkastet, altid lys. Layout: one phone-width column, role switch on top, bottom sheet for producer detail */
:root{
  --bg:#F2EAD7; --card:#FBF7EC; --ink:#2A241D; --muted:#6A5F50; --line:rgba(42,36,29,.15);
  --sand:#E7DBBE; --amber:#C5853B; --amber-ink:#8A5A1C; --red:#B5462E; --red-ink:#8E3420; --green:#5E7A3A; --sage:#93A06B;
  --map:#EDE3CC; --water:#C9D1C9; --road:#FBF7EC; --you:#4F6FA8;
  --on-ink:#FBF7EC; color-scheme:light;
  --display:'Fraunces',Georgia,'Times New Roman',serif;
  --body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:16px 48px}
.app{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.08}
h1{font-size:28px} h2{font-size:23px} h3{font-size:19px;font-weight:500}
p{margin:0}
.muted{color:var(--muted)}
.eb{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px}
.top .name{display:flex;flex-direction:column;gap:2px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--sand);border-radius:24px;padding:4px}
.seg button{height:42px;border:0;border-radius:20px;background:transparent;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{height:50px;border-radius:26px;border:0;background:var(--ink);color:var(--on-ink);font-weight:600;font-size:15px;padding:0 20px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.paym{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);text-align:left;width:100%;font:inherit;color:var(--ink)}
.paym[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.paym .pm{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:11px;letter-spacing:.02em}
.pm.mp{background:#5A78FF;color:#fff}.pm.cd{background:var(--sand);color:var(--ink)}
.paym .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line)}.paym[aria-pressed="true"] .dot{border:6px solid var(--ink)}
.mpbox{background:#fff;border-radius:22px;padding:22px 18px;box-shadow:0 10px 30px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:14px;color:#14161a;text-align:center}
.mpbox .amt{font-size:40px;font-weight:700;letter-spacing:-.02em}
.mpbtn{height:52px;border-radius:26px;border:0;font-weight:700;font-size:16px}
.payline{display:flex;justify-content:space-between;gap:10px;font-size:14px}.payline>.num,.payline>b.num{white-space:nowrap}
.ledger{width:100%;border-collapse:collapse;font-size:13.5px}.ledger th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:6px 4px;border-bottom:1px solid var(--line)}.ledger td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}.ledger td.n,.ledger th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.btn.small{height:40px;font-size:14px;padding:0 14px;border-radius:20px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.block{width:100%}
.chip{height:40px;padding:0 14px;border-radius:20px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.inp{height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:0 14px;font-size:16px;width:100%;color:var(--ink);font-weight:400}
textarea.inp{height:auto;padding:12px 14px;resize:vertical;min-height:72px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tag{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:5px 9px;border-radius:10px;white-space:nowrap}
.tag.last{background:var(--red);color:#FBF7EC}
.tag.two{background:var(--sand);color:var(--amber-ink)}
.tag.three{background:var(--sand);color:var(--muted)}
.tag.ok{background:var(--sand);color:var(--green)}
.tag.wait{background:var(--sand);color:var(--amber-ink)}
.dot{width:12px;height:12px;border-radius:6px;flex:none}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li .grow{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:2px}
.li b{font-weight:600}
.num{font-variant-numeric:tabular-nums}
.price{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.price b{font-size:18px}
.price s{color:var(--muted);font-size:13px}
.step{display:flex;align-items:center;gap:8px}
.step button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-size:20px}
.step button[disabled]{opacity:.35}
.map{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:var(--map)}
.map svg{display:block;width:100%;height:auto}
.pin{cursor:pointer}
.pin:focus-visible circle{stroke:var(--amber);stroke-width:4}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{border-radius:14px;padding:12px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.stat.dark{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.stat span{font-size:12px;opacity:.75}
.stat b{font-family:var(--display);font-weight:500;font-size:20px}
.banner{border-radius:14px;padding:12px 14px;background:var(--sand);font-size:14px}
.empty{padding:22px 8px;text-align:center;color:var(--muted);font-size:14px}
.split{display:flex;height:12px;border-radius:6px;overflow:hidden}
.split span:first-child{flex:90 1 0;background:var(--sage)}
.split span:last-child{flex:10 1 0;background:var(--ink)}
.pbar{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.pbar span{height:8px;border-radius:4px;background:var(--sand)}.pbar .on{background:var(--sage)}.pbar .half{background:linear-gradient(90deg,var(--amber) 50%,var(--sand) 50%)}
.plbl{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;font-size:12.5px;font-weight:600;color:var(--muted);margin-top:-8px}.plbl .on{color:var(--green)}.plbl .cur{color:var(--amber-ink)}
.pnext{display:grid;grid-template-columns:44px 1fr;gap:12px;background:var(--bg);border-radius:14px;padding:14px;border:1px solid var(--line)}
.pic{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.timeline li{display:flex;gap:12px;align-items:flex-start}
.timeline i{width:22px;height:22px;border-radius:11px;border:2px solid var(--line);flex:none}
.timeline i.done{background:var(--sage);border-color:var(--sage)}
.timeline i.now{border-color:var(--amber)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,16,12,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding-top:40px}
.sheet{background:var(--bg);width:100%;max-width:492px;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:12px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.close{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--card);font-size:18px;flex:none}
.code{font-family:var(--display);font-size:38px;letter-spacing:.14em}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--on-ink);padding:12px 18px;border-radius:22px;font-weight:600;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.mapedit{cursor:crosshair}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
.lbl{font-size:13px;font-weight:600;color:var(--muted)}
.seg.sub.four{grid-template-columns:repeat(4,minmax(0,1fr))}.seg.sub.four button{font-size:13px;padding:0 4px}
.stat b{white-space:nowrap}
.seg.sub{background:transparent;border:1.5px solid var(--line);padding:3px}
.seg.sub button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);box-shadow:none}
.ph{display:grid;place-items:center;border-radius:12px;background:var(--sand);color:var(--amber);flex:none}
.photo{width:96px;height:96px;flex:none;border-radius:14px;border:1.5px dashed var(--line);background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.photo:focus-within{outline:2px solid var(--amber)}
.li.prod{align-items:flex-start}
.step.mini button{width:36px;height:36px;border-radius:10px;font-size:18px}
.app.wide{max-width:980px}
.tablewrap{overflow-x:auto;margin-inline:-4px}
.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:620px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 8px;border-bottom:1.5px solid var(--ink)}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl .r{text-align:right}
.tbl b{font-weight:600}
.days{display:grid;grid-template-columns:repeat(7,minmax(78px,1fr));gap:6px;overflow-x:auto;padding-bottom:4px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);text-align:center}
.day[aria-pressed="true"]{border-color:var(--ink);background:var(--bg)}
.day .dl{font-weight:600;font-size:13px}
.bars{display:flex;align-items:flex-end;gap:4px;height:50px;border-bottom:1px solid var(--line);padding-inline:6px}
.bars i{width:12px;border-radius:3px 3px 0 0;min-height:2px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px}
input[type=range]{width:100%}
.rt{font-family:var(--display);font-weight:500;font-size:18px}
.li.rec{align-items:flex-start}
.hot{color:var(--red-ink);font-weight:600}
.meter{height:8px;border-radius:4px;background:var(--sand);overflow:hidden}
.meter i{display:block;height:100%;background:var(--amber);transition:width .3s}
.photo.wide{width:100%;height:auto;min-height:72px;padding:14px;flex-direction:column}

<script>
(function(){
const FEE = 0.10;
const CATS = ['Grønt','Mejeri','Kød og fisk','Bageri','Mel og korn','Honning og syltet','Andet'];
const SHELVES = ['1 Lokal','1 Basis','1 Hjem','1 Krop'];
const S = {producers:[],listings:[],products:[],reservations:[],payouts:[],role:'kunde',ready:false,me:null,
  acting:null, sheet:null, qty:{}, onlyLast:false, pin:null, cat:'Grønt', exp:1, kitchen:true, busy:false,
  ptab:'overblik', pform:false, atab:'overblik', cq:'', ctype:'alle', cprod:'', sellRate:.5, kday:0, bform:false, pform2:false, pantry:[], batches:[], books:[], recipes:[], scan:null, bookFile:null, bookTitle:'', delBook:null, ai:null, bprefill:null, su:null, fcat:'', myPos:{name:'Storvorde',lat:57.00392,lng:10.10125}, radius:20, shelf:'1 Lokal', inBox:true, photo:null, fromProduct:null};
let db=null, user=null;

const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kr = n => (Math.round(n*100)/100).toLocaleString('da-DK',{minimumFractionDigits:2,maximumFractionDigits:2})+' kr.';
const r2 = n => Math.round(n*100)/100;
const todayStr = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const addDays = n => { const d=new Date(); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const daysLeft = iso => Math.round((new Date(iso+'T12:00:00') - new Date(todayStr()+'T12:00:00'))/864e5);
// Prisen følger datoen: -20 % (3+ dage), -35 % (2 dage), -50 % (sidste dag)
const discount = dl => dl<=0 ? .5 : dl===1 ? .35 : .2;
const unitPrice = l => r2(l.normalPrice*(1-discount(daysLeft(l.expires))));
function urgency(dl){ if(dl<=0) return {cls:'last',txt:'Sidste dag',color:'var(--red)'}; if(dl===1) return {cls:'two',txt:'2 dage',color:'var(--amber)'}; return {cls:'three',txt:(dl+1)+' dage',color:'var(--ink)'}; }
const code = () => Array.from({length:4},()=> 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*31)]).join('');
function toast(t){ const el=$('#toast'); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2600); }

const val = id => (document.getElementById(id)?.value||'').trim();

const prodById = id => S.producers.find(p=>p.id===id);
const productById = id => S.products.find(p=>p.id===id);
const approvedP = id => prodById(id)?.status==='approved';
const live = () => S.listings.filter(l => l.status==='live' && l.qty>0 && daysLeft(l.expires)>=0 && approvedP(l.producerId));
const shelf = () => S.products.filter(p => p.status==='approved' && !p.paused && p.stock>0 && approvedP(p.producerId));
/* ---------- betaling (simuleret Stripe Connect) ----------
   I den rigtige app opretter en lille server betalingen hos Stripe med manuel trækning:
   beløbet reserveres ved bestilling og trækkes ved afhentning. Isakrams 10 % trækkes fra
   som platformsgebyr, og resten udbetales til producentens egen Stripe-konto. Her er alt simuleret. */
const PAYFEE = {pct:0.015, fixed:1.80};   // EKSEMPEL på betalingsgebyr pr. betaling. Ret til jeres aftale med Stripe.
const PAYM = {mobilepay:'MobilePay', card:'Kort'};
const payState = r => r.payStatus || (r.status==='picked'?'captured':r.status==='reserved'?'authorized':'released');
const payFeeOf = r => r.payFee!=null ? r.payFee : r2(r.total*PAYFEE.pct + (r.payFixed===false?0:PAYFEE.fixed));
/* To afregningsmodeller. Hver reservation gemmer, hvilken model og andel den blev solgt under. */
const MODELS = {
  direct:{key:'direct', name:'Direkte betaling', short:'90/10', share:0.10, cadence:'Hver fredag', blurb:'I får 90 % udbetalt hver fredag til jeres egen Stripe-konto.', seller:'Producenten (Isakram formidler)', account:'Egen Stripe-konto'},
  konto:{key:'konto', name:'Kontoafregning', short:'50/50', share:0.50, cadence:'Den 1. i måneden', blurb:'Isakram sælger og står for kunden. I får 50 % overført den 1. i måneden.', seller:'Isakram', account:'Konto hos Isakram'}
};
const modelOf = p => MODELS[p&&p.settle] || MODELS.direct;
const shareOf = r => r.share!=null ? r.share : FEE;
const isakOf = r => r2(r.total*shareOf(r));
const prodOf = r => r2(r.total-isakOf(r));
const splitTxt = r => `${Math.round((1-shareOf(r))*100)}/${Math.round(shareOf(r)*100)}`;
function nextSettle(m){ if(m.key==='konto'){ const d=new Date(); d.setMonth(d.getMonth()+1,1); return d.toLocaleDateString('da-DK',{weekday:'long',day:'numeric',month:'long'}); } return nextPayday(); }
const payoutOk = p => !!(p && p.payout && p.payout.status==='active');
const payMethodTxt = r => r.payMethod ? PAYM[r.payMethod]||r.payMethod : 'Betaling ved afhentning';
function nextPayday(){ const d=new Date(); const add=(5-d.getDay()+7)%7||7; d.setDate(d.getDate()+add); return d.toLocaleDateString('da-DK',{weekday:'long',day:'numeric',month:'long'}); }
const krs = n => Math.round(n).toLocaleString('da-DK')+' kr.';
const dateTxt = iso => iso ? new Date(iso).toLocaleDateString('da-DK',{day:'numeric',month:'short'}) : '';
const unpaid = pid => S.reservations.filter(r=>r.producerId===pid && payState(r)==='captured' && !r.payoutId);
const myProducer = () => S.acting ? prodById(S.acting) : S.producers.find(p=>p.ownerId && p.ownerId===S.me);
const thumb = (p,size=56) => p.image ? `<img src="${esc(p.image)}" alt="" style="width:${size}px;height:${size}px;border-radius:12px;object-fit:cover;flex:none">` : `<span class="ph" style="width:${size}px;height:${size}px" aria-hidden="true"><svg viewBox="0 0 40 200" height="${Math.round(size*.5)}"><circle cx="20" cy="14" r="10" fill="currentColor"></circle><line x1="20" y1="44" x2="20" y2="194" stroke="currentColor" stroke-width="6" stroke-linecap="round"></line></svg></span>`;

/* ---------- map ---------- */
function mapSvg({pins, edit=false, pinXY=null}){
  const P = pins.map(p=>{
    const x=p.x/100*390, y=p.y/100*280, r=p.r||9, c=p.color||'var(--ink)';
    return `<g class="pin" tabindex="0" role="button" data-pid="${esc(p.id)}" aria-label="${esc(p.name)}"><circle cx="${x}" cy="${y-18}" r="${r}" fill="${c}" stroke="var(--ink)" stroke-width="2"></circle><line x1="${x}" y1="${y-18+r+3}" x2="${x}" y2="${y+8}" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"></line></g>`;
  }).join('');
  const sel = pinXY ? `<g><circle cx="${pinXY.x/100*390}" cy="${pinXY.y/100*280-18}" r="11" fill="var(--amber)" stroke="var(--ink)" stroke-width="2"></circle><line x1="${pinXY.x/100*390}" y1="${pinXY.y/100*280-4}" x2="${pinXY.x/100*390}" y2="${pinXY.y/100*280+8}" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"></line></g>` : '';
  return `<div class="map"><svg viewBox="0 0 390 280" ${edit?'class="mapedit" id="mapedit"':''} role="img" aria-label="Kort over Gudumholm og omegn">
    <rect width="390" height="280" fill="var(--map)"></rect>
    <path d="M0 50 Q90 22 170 60 Q250 96 320 50 Q360 26 390 34 L390 0 L0 0 Z" fill="var(--water)"></path>
    <path d="M0 200 Q80 180 140 215 T260 240 T390 210" fill="none" stroke="var(--road)" stroke-width="8"></path>

function customerMap(slot){

  m.on('contextmenu',e=>{ S.myPos={name:'Valgt punkt',lat:e.latlng.lat,lng:e.latlng.lng}; render(); });
  maps.kunde={el,m,pins,circle,me,fitKey:''};

function pickMap(slot){
  if(maps.pick) return maps.pick;
  const el=document.createElement('div'); slot.appendChild(el); el.className='leaf pick'; el.setAttribute('aria-label','Kort: tryk for at sætte jeres afhentningssted');
  const m=baseMap(el); m.setView([S.myPos.lat,S.myPos.lng],11);

  const place=ll=>{ S.pin={lat:+ll.lat.toFixed(5),lng:+ll.lng.toFixed(5)}; if(!mk){ mk=L.marker(ll,{draggable:true, icon:pinIcon('#C5853B',11,false)}).addTo(m); mk.on('dragend',()=>place(mk.getLatLng())); } else mk.setLatLng(ll); const o=document.getElementById('pin-txt'); if(o) o.textContent=pinTxt(); };
  m.on('click',e=>place(e.latlng));

}

    k.pins.clearLayers();
    (S._pins||[]).forEach(p=>{

function suFind(cvr){
  const su=S.su; su.err=null;
  if(cvr) su.cvr=cvr; else suCollect();
  if(!/^\d{8}$/.test(su.cvr)){ suErr('CVR-nummeret skal være 8 cifre.'); return; }
  const co=DEMO_CVR[su.cvr];
  su.co=co||null; su.notFound=!co; su.manual=false;
  if(co){ su.name=co.name; su.address=co.address; su.town=co.town; su.catSuggested=[co.branche,...(co.bibranche||[])].map(catFromBranche).filter((c,i,a)=>a.indexOf(c)===i); if(!su.cats.length){ su.cats=su.catSuggested.slice(); su.cat=su.cats[0]||null; } }
  render();
}
function suNext(){
  const su=S.su; suCollect(); su.err=null;
  if(su.step===1){
    if(!su.co){ if(!su.name) return suErr('Skriv virksomhedens navn.'); if(!su.address) return suErr('Skriv adressen.'); }
    su.step=2;
  } else if(su.step===2){
    if(!su.verified) return suErr('Bekræft telefonnummeret med koden.');
    su.step=3;
  } else if(su.step===3){
    if(!su.cats.length) return suErr('Vælg mindst én kategori.'); if(!su.cats.includes(su.cat)) su.cat=su.cats[0];
    su.step=4;
    if(!S.pin && su.co) S.pin={lat:su.co.lat,lng:su.co.lng};
  } else if(su.step===4){
    if(!S.pin) return suErr('Sæt en nål på kortet, hvor kunderne henter.');
    su.step=5;
  }
  render();
}
function suSend(){
  const su=S.su; suCollect(); su.err=null;
  const n=digits(su.phone);
  if(n.length!==8) return suErr('Skriv et dansk telefonnummer med 8 cifre.');
  su.codeSent=String(1000+Math.floor(Math.random()*9000));
  su.cvrMatch = su.co&&su.co.phoneEnd ? n.slice(-4)===su.co.phoneEnd : null;
  render(); setTimeout(()=>document.getElementById('s-code')?.focus(),0);
}
function suVerify(){
  const su=S.su; suCollect(); su.err=null;
  if(su.code!==su.codeSent) return suErr('Koden passer ikke. Tjek SMS’en, eller send en ny kode.');
  su.verified=true; render();
}
async function signup(){
  const su=S.su; suCollect(); su.err=null;
  if(!su.accept) return suErr('Sæt flueben ved producentaftalen.');
  if(!S.me) return suErr('Log ind for at sende ansøgningen.');
  try{
    await db.collection('producers').add({name:su.name, category:su.cat, categories:su.cats.slice(), settle:su.settle||'direct', cvr:su.cvr||'', cvrFound:!!su.co, branche:su.co?su.co.branche:'', brancheTxt:su.co?su.co.brancheTxt:'',
      phone:su.phone, phoneVerified:true, phoneMatchesCvr:su.cvrMatch, town:su.town, story:su.story, address:su.address,
      lat:S.pin.lat, lng:S.pin.lng, status:'pending', ownerId:S.me, createdAt:new Date().toISOString()});
    S.acting=null; S.pin=null; S.su=suNew(); maps.pick&&maps.pick.clear(); toast('Ansøgning sendt');
  }catch(e){ suErr('Ansøgningen kunne ikke gemmes. Du skal have adgang som Contributor eller højere.'); }
}

  const res = S.reservations.filter(r=>r.producerId===p.id);
  const open = res.filter(r=>r.status==='reserved').sort((a,b)=>a.createdAt<b.createdAt?1:-1);
  const picked = res.filter(r=>r.status==='picked');
  const sold = picked.reduce((s,r)=>s+r.total,0);
  const saved = picked.filter(r=>r.kind!=='fast').reduce((s,r)=>s+r.qty,0);

/* Isakram: fanen Økonomi */
function vEconomy(){
  const ext=S.reservations.filter(r=>r.producerId!==KITCHEN_ID);
  const by=st=>ext.filter(r=>payState(r)===st), sum=(a,f)=>r2(a.reduce((s,r)=>s+f(r),0));
  const held=by('authorized'), cap=by('captured'), rel=by('released');
  const capD=cap.filter(r=>(r.settle||'direct')==='direct'), capK=cap.filter(r=>r.settle==='konto');
  const capT=sum(cap,r=>r.total), isD=sum(capD,isakOf), isK=sum(capK,isakOf), toProd=sum(cap,prodOf), pfee=sum(cap.filter(r=>r.payMethod),payFeeOf);
  const kitchen=sum(S.reservations.filter(r=>r.producerId===KITCHEN_ID&&payState(r)==='captured'),r=>r.total);
  const net=r2(isD+isK-pfee+kitchen);
  const prods=S.producers.filter(p=>p.status==='approved'&&p.id!==KITCHEN_ID).map(p=>({p,due:unpaid(p.id)})).filter(x=>x.due.length||!payoutOk(x.p));
  const dueOf=k=>prods.filter(x=>payoutOk(x.p)).some(x=>x.due.some(r=>(r.settle||'direct')===k));
  const pays=[...S.payouts].sort((a,b)=>a.createdAt<b.createdAt?1:-1).slice(0,8);
  const ex=100, exFee=r2(ex*PAYFEE.pct+PAYFEE.fixed);
  const cmp=[['Producenten får',m=>kr(ex*(1-m.share))],['Isakram får',m=>kr(ex*m.share)],['Betalingsgebyr (eksempel)',m=>'−'+kr(exFee)],['Isakram netto',m=>`<b>${kr(r2(ex*m.share-exFee))}</b>`],['Udbetaling',m=>m.cadence],['Sælger til kunden',m=>m.seller],['Producentens konto',m=>m.account]];
  return `
  <div class="stats"><div class="stat dark"><span>Isakram netto</span><b class="num">${krs(net)}</b></div><div class="stat"><span>Trukket</span><b class="num">${krs(capT)}</b></div><div class="stat"><span>Reserveret</span><b class="num">${krs(sum(held,r=>r.total))}</b></div></div>

    <div class="payline"><span>Isakram, direkte betaling (10 %)</span><span class="num">${kr(isD)}</span></div>
    <div class="payline"><span>Isakram, kontoafregning (50 %)</span><span class="num">${kr(isK)}</span></div>
    <div class="payline"><span>Betalingsgebyrer <span class="muted">(eksempel: ${String(PAYFEE.pct*100).replace('.',',')} % + ${kr(PAYFEE.fixed)} pr. betaling)</span></span><span class="num">−${kr(pfee)}</span></div>
    <div class="payline"><span>Køkkenets eget salg</span><span class="num">${kr(kitchen)}</span></div>
    <div class="payline" style="border-top:1px solid var(--line);padding-top:8px"><b>Isakram netto</b><b class="num">${kr(net)}</b></div>
    <p class="muted" style="font-size:13px;margin:0">Reserveret, men ikke hentet: ${kr(sum(held,r=>r.total))} (${held.length}). Frigivet efter annullering eller udeblivelse: ${kr(sum(rel,r=>r.total))} (${rel.length}). Gebyrsatsen er et eksempel. Ret den til jeres aftale med betalingsudbyderen.</p>
  </section>
  <section class="card stack"><h2>Sammenlign modellerne</h2><span class="muted" style="font-size:13px">Eksempel på et salg til ${kr(ex)}</span>
    <table class="ledger"><thead><tr><th></th>${Object.values(MODELS).map(m=>`<th class="n">${m.name}<br><span style="font-weight:400">${m.short}</span></th>`).join('')}</tr></thead><tbody>${cmp.map(([l,f])=>`<tr><td>${l}</td>${Object.values(MODELS).map(m=>`<td class="n" style="white-space:normal">${f(m)}</td>`).join('')}</tr>`).join('')}</tbody></table>
    <p class="muted" style="font-size:12.5px;margin:0">Moms afhænger af, om Isakram formidler (direkte betaling) eller sælger varen videre (kontoafregning). Tal med en revisor, før I vælger.</p>
  </section>
  <section class="card stack"><h2>Til udbetaling</h2>
    ${prods.length?`<div class="list">${prods.map(({p,due})=>{const g=sum(due,r=>r.total), n=sum(due,prodOf), m=modelOf(p);return `<div class="li"><span class="grow"><b>${esc(p.name)}</b><span class="muted">${m.name} ${m.short} · ${due.length?due.length+' salg · ':''}${payoutOk(p)?'Reg. '+esc(p.payout.reg)+' ••'+esc(p.payout.last4):'mangler konto'}</span></span>${due.length?`<span class="num" style="text-align:right;font-size:14px;white-space:nowrap"><b>${kr(n)}</b><br><span class="muted">af ${kr(g)}</span></span>`:''}${payoutOk(p)?'':'<span class="tag wait">Venter</span>'}</div>`}).join('')}</div>`:`<p class="empty">Intet at udbetale lige nu.</p>`}
    <button class="btn block" data-porun="direct" ${dueOf('direct')&&!S.busy?'':'disabled'}>Demo: kør fredagens udbetaling</button>
    <button class="btn ghost block" data-porun="konto" ${dueOf('konto')&&!S.busy?'':'disabled'}>Demo: kør månedens kontoafregning</button>

/* ---------- kogebøger: scanning, match og forslag ---------- */
let sampleFn = null;
/* Billedgenkendelse uden for Claude (fx hjemmesiden): en funktion (billede, {name,cats}, signal) => produktdata. Sættes af hjemmesidens build. */
let recFn = null;
const recOn = () => !!(recFn||sampleFn);
const STAPLES = ['salt','peber','vand','sukker','is'];
const normName = s => String(s||'').toLowerCase().split(',')[0].replace(/[^a-zæøå ]/g,' ').trim();
const wordsOf = s => normName(s).split(/\s+/).filter(w=>w.length>=3);
const stem = w => w.length>=4 ? w.replace(/(erne|ene|er|en|e|r)$/,'') : w;
function wordMatch(a,b){
  if(a===b) return true;
  const sa=stem(a), sb=stem(b);
  if(sa===sb && sa.length>=3) return true;
  if(a.length>=3 && b.length>=3 && (a.endsWith(b)||b.endsWith(a)) && !/mel$/.test(a.length>b.length?a:b)===!/mel$/.test(a.length>b.length?b:a)) return true;
  return sa.length>=6 && sb.length>=6 && Math.abs(sa.length-sb.length)<=3 && sa.slice(0,6)===sb.slice(0,6);
}
const isStaple = base => wordsOf(base).some(w=>STAPLES.includes(w)) || !wordsOf(base).length;
function invMatch(base, inv){ const bw=wordsOf(base); return inv.find(i=>wordsOf(i.name).some(w=>bw.some(b=>wordMatch(w,b)))); }

// Det køkkenet har eller får på dag n
function inventoryFor(n){
  const inv = S.pantry.filter(p=>p.qty>0 && daysLeft(p.bestBefore)>=n).map(p=>({id:p.id,name:p.name,qty:p.qty,unit:p.unit,left:daysLeft(p.bestBefore)-n,src:'forråd'}));
  for(let k=0;k<=n;k++) incomingFor(k).forEach(x=>inv.push({id:null,listingId:x.l.id,name:x.l.name,qty:x.exp,unit:'stk.',left:k+2-n,src:k===0?'klar til afhentning':'på vej '+dayLabel(k).toLowerCase()}));
  return inv;
}
const weightOf = left => left<=1 ? 3 : left<=3 ? 2 : left<=7 ? 1 : .25;
const SELLABLE = ['suppe','syltning','bagværk','sauce','dessert'];
function rankRecipes(n, limit=6){
  const inv = inventoryFor(n);
  return S.recipes.map(r=>{
    const ings = (r.ingredients||[]).filter(i=>!isStaple(i.base||i.name));
    if(!ings.length) return null;
    const uses=[], missing=[], usedInv=new Set();
    ings.forEach(i=>{ const m=invMatch(i.base||i.name, inv); if(m && !usedInv.has(m)){ usedInv.add(m); uses.push({ing:i,inv:m}); } else if(!m) missing.push(i); });
    if(!uses.some(u=>u.inv.left<=3)) return null;           // skal bruge noget, der snart udløber
    const cover = uses.length/ings.length;
    if(cover<.4) return null;
    const score = uses.reduce((s,u)=>s+weightOf(u.inv.left),0) + 3*cover - .4*missing.length + (SELLABLE.includes(r.category)&&(r.keepsDays||0)>=3?1:0);
    return {r,uses,missing,cover,score};
  }).filter(Boolean).sort((a,b)=>b.score-a.score).slice(0,limit);
}
const leftTxt = l => l<=0?'i dag':l===1?'i morgen':l+' dage';

// Enheder: omregn opskriftens mængde til forrådets enhed, når det giver mening
const UNIT = {g:['kg',.001],gram:['kg',.001],kg:['kg',1],ml:['l',.001],cl:['l',.01],dl:['l',.1],l:['l',1],liter:['l',1],stk:['stk',1],'stk.':['stk',1]};
function convert(qty, from, to){
  const a=UNIT[String(from||'').toLowerCase().trim()], b=UNIT[String(to||'').toLowerCase().trim()];
  if(!(qty>0) || !a || !b || a[0]!==b[0]) return null;
  return r2(qty*a[1]/b[1]);
}
function planFromRecipe(id, scale=1){
  const r = S.recipes.find(x=>x.id===id); if(!r) return;
  const inv = inventoryFor(S.kday).filter(i=>i.src==='forråd');
  const inputs = {};
  (r.ingredients||[]).forEach(i=>{ if(isStaple(i.base||i.name)) return; const m=invMatch(i.base||i.name, inv); if(!m) return; const q=convert((i.qty||0)*scale, i.unit, m.unit); if(q!=null) inputs[m.id]=Math.min(q, m.qty); });
  S.bprefill = {name:r.title, yield:r.yield?r2(r.yield*scale):'', unit:r.yieldUnit||'', inputs, recipeId:r.id, ref:`${r.bookTitle}, s. ${r.page}`};
  S.bform = true; S._prefill = true; render();
  document.getElementById('bform')?.scrollIntoView({behavior:'smooth',block:'start'});
}

/* scanning */
let pdfjsReady = null;
function loadPdfJs(){
  if(pdfjsReady) return pdfjsReady;
  const base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  const load = src => new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('pdfjs')); document.head.appendChild(s); });
  pdfjsReady = load(base+'pdf.worker.min.js').then(()=>load(base+'pdf.min.js')).then(()=>{ window.pdfjsLib.GlobalWorkerOptions.workerSrc = base+'pdf.worker.min.js'; return window.pdfjsLib; });
  pdfjsReady.catch(()=>{ pdfjsReady=null; });
  return pdfjsReady;
}
async function pageImage(page){
  const v1=page.getViewport({scale:1}); const scale=Math.min(2.5, Math.sqrt(1.2e6/(v1.width*v1.height)));
  const vp=page.getViewport({scale}); const c=document.createElement('canvas'); c.width=Math.floor(vp.width); c.height=Math.floor(vp.height);
  const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height);
  await page.render({canvasContext:ctx, viewport:vp}).promise;
  return new Promise(r=>c.toBlob(r,'image/jpeg',.82));
}
function scanPrompt(title, texts, imgPages){
  return `Du laver et opskriftsregister for et professionelt køkken. Her er sider fra kogebogen "${title}".
Find hver opskrift, der BEGYNDER på disse sider. Spring over tekst, der fortsætter en opskrift fra en tidligere side, samt forord, indholdsfortegnelser og registre.
Svar KUN med et JSON-array. Hvert element:
{"title": opskriftens titel, "page": sidetallet (det trykte sidetal hvis det står på siden, ellers PDF-siden), "yield": tal eller null, "yieldUnit": fx "personer", "glas", "stk.", "l", "category": en af "suppe","sauce","syltning","bagværk","hovedret","tilbehør","dessert","drikke","andet", "keepsDays": anslået antal dage retten holder sig på køl efter tilberedning, "ingredients": [{"name": som i bogen, "base": grundvaren på dansk, ental, små bogstaver (fx "kartoffel", "løg", "fløde", "æble", "makrel", "hvedemel"), "qty": tal eller null, "unit": fx "g","kg","dl","l","stk","spsk","tsk" eller ""}]}
Gengiv IKKE fremgangsmåden. Findes der ingen opskrifter, svar [].
${imgPages.length?`\nBillederne er PDF-side ${imgPages.join(', ')} i den rækkefølge.\n`:''}
${texts.join('\n\n')}`;
}
const SCAN_STOP = {not_granted:'Claude blev ikke tilladt for denne side.', sampling_disabled:'Claude er ikke tilgængelig for jeres konto.', session_expired:'Log ind på claude.ai igen og fortsæt.', rate_limited:'Claude-forbruget er brugt op for nu. Fortsæt scanningen senere.', not_declared:'Siden har ikke adgang til Claude.', capability_disabled:'Claude kan ikke bruges i denne visning.', capability_removed:'Claude kan ikke bruges i denne visning.'};
async function scanBook(){
  const file=S.bookFile, title=(val('k-title')||S.bookTitle||'Kogebog').slice(0,120);
  if(!file||!sampleFn) return;
  let lib;
  try{ lib=await loadPdfJs(); }catch(e){ toast('PDF-læseren kunne ikke hentes. Prøv igen.'); return; }
  let pdf;
  try{ pdf=await lib.getDocument({data:await file.arrayBuffer()}).promise; }catch(e){ toast('Filen kunne ikke åbnes som PDF.'); return; }
  const total=pdf.numPages;
  let book=S.books.find(b=>b.title===title && b.status!=='done'), bookId, start=0;
  if(book){ bookId=book.id; start=book.lastPage||0; await db.doc('books/'+bookId).update({status:'scanning', pages:total}); }
  else { const ref=await db.collection('books').add({title, pages:total, lastPage:0, status:'scanning', createdAt:new Date().toISOString()}); bookId=ref.id; }
  const seen=new Set(S.recipes.filter(r=>r.bookId===bookId).map(r=>(r.title+'|'+r.page).toLowerCase()));
  const ctl=new AbortController();
  S.scan={bookId,title,page:start,total,found:seen.size,ctl,msg:'',done:false,skipped:[]}; S.bookFile=null; render();
  let imgMax=0; try{ const lim=await sampleFn.limits(); imgMax=Math.min(4, lim.images?.maxCount||0); }catch(_){}
  let p=start+1, stopMsg='';
  while(p<=total && !ctl.signal.aborted){
    const texts=[], imgs=[], imgPages=[]; let chars=0; const first=p;
    while(p<=total && texts.length+imgs.length<8 && chars<24000){
      const page=await pdf.getPage(p);
      const tc=await page.getTextContent();
      const t=tc.items.map(i=>i.str+(i.hasEOL?'\n':' ')).join('').replace(/[ \t]+/g,' ').trim();
      if(t.length>=60){ texts.push(`--- PDF-side ${p} ---\n${t}`); chars+=t.length; }
      else if(imgMax){ if(imgs.length>=imgMax) break; imgs.push(await pageImage(page)); imgPages.push(p); }
      p++;
    }
    if(!texts.length && !imgs.length){ S.scan.page=p-1; render(); continue; }
    S.scan.msg=`læser side ${first}-${p-1}`; render();
    let list=[];
    try{
      const opts={signal:ctl.signal, modelTier: imgs.length?'default':'quick'}; if(imgs.length) opts.images=imgs;
      const out=await sampleFn.json(scanPrompt(title,texts,imgPages), opts);
      list=Array.isArray(out)?out:[];
    }catch(e){
      if(e.code==='cancelled') break;
      if(SCAN_STOP[e.code]){ stopMsg=SCAN_STOP[e.code]; p=first; break; }
      S.scan.skipped.push(`${first}-${p-1}`);
    }
    for(const x of list){
      const t=String(x&&x.title||'').trim(); if(!t) continue;
      const pg=Number(x.page)||first; const key=(t+'|'+pg).toLowerCase(); if(seen.has(key)) continue; seen.add(key);
      const ings=(Array.isArray(x.ingredients)?x.ingredients:[]).slice(0,40).map(i=>({name:String(i&&i.name||'').slice(0,80), base:String(i&&i.base||i&&i.name||'').toLowerCase().slice(0,40), qty:Number(i&&i.qty)>0?Number(i.qty):null, unit:String(i&&i.unit||'').slice(0,12)})).filter(i=>i.name);
      try{ await db.collection('recipes').add({bookId, bookTitle:title, title:t.slice(0,120), page:pg, yield:Number(x.yield)>0?Number(x.yield):null, yieldUnit:String(x.yieldUnit||'').slice(0,20), category:String(x.category||'andet').slice(0,20), keepsDays:Number(x.keepsDays)>0?Math.round(Number(x.keepsDays)):null, ingredients:ings, createdAt:new Date().toISOString()}); S.scan.found++; }
      catch(e){ if(e.code==='quota_exceeded'){ stopMsg='Databasen er fuld. Slet en kogebog for at gøre plads.'; ctl.abort(); break; } }
    }
    S.scan.page=p-1;
    try{ await db.doc('books/'+bookId).update({lastPage:p-1, recipeCount:S.scan.found}); }catch(_){}
    render();
  }
  const finished = p>total && !ctl.signal.aborted && !stopMsg;
  try{ await db.doc('books/'+bookId).update({status:finished?'done':'stopped', lastPage:Math.min(total,p-1), recipeCount:S.scan.found}); }catch(_){}
  S.scan.done=true;
  S.scan.msg = stopMsg || (finished ? `Færdig: ${S.scan.found} opskrifter i registeret.${S.scan.skipped.length?` Side ${S.scan.skipped.join(', ')} kunne ikke læses.`:''}` : `Stoppet ved side ${p-1}. Vælg samme PDF igen for at fortsætte.`);
  render();
}
async function deleteBook(id){
  S.delBook=null; render();
  for(const r of S.recipes.filter(r=>r.bookId===id)){ try{ await db.doc('recipes/'+r.id).delete(); }catch(_){} }
  try{ await db.doc('books/'+id).delete(); }catch(_){}
  toast('Kogebogen er slettet');
}

async function askChef(){
  const n=S.kday, inv=inventoryFor(n);
  if(!inv.length){ S.ai={day:n,err:'Der er intet på lager eller på vej denne dag.'}; render(); return; }
  const cands = rankRecipes(n, 25);
  if(!cands.length){ S.ai={day:n,err:'Ingen opskrifter passer til lageret endnu.'}; render(); return; }
  const ctl=new AbortController(); S.ai={day:n,loading:true,ctl}; render();
  const prompt = `Du er køkkenchef i Isakram-køkkenet i Storvorde. Køkkenet laver mad af overskudsvarer fra lokale producenter og sælger den videre i glas og portioner. Målet er, at intet går til spilde.
Lager og varer på vej (${dayLabel(n).toLowerCase()}):
${inv.map(i=>`- ${i.name}: ${i.qty} ${i.unit}, ${i.src==='forråd'?'sidste dag om '+Math.max(0,i.left)+' dage':i.src}`).join('\n')}

Opskrifter fra vores kogebøger (id | titel | udbytte | holdbarhed | ingredienser):
${cands.map(c=>`${c.r.id} | ${c.r.title} | ${c.r.yield||'?'} ${c.r.yieldUnit||''} | ${c.r.keepsDays||'?'} dage | ${(c.r.ingredients||[]).map(i=>(i.qty?i.qty+' '+i.unit+' ':'')+(i.base||i.name)).join(', ')}`).join('\n')}

Foreslå højst 3 produktioner fra listen, der bruger mest muligt af det, der snart udløber, og som kan holde sig og sælges videre. Tag hensyn til mængderne på lager.
Svar KUN med et JSON-array: [{"recipeId": id fra listen, "why": én kort sætning på dansk, "scale": hvor mange gange opskriften skal laves (tal), "sellAs": kort salgsform, fx "10 glas à 4 dl"}]`;
  try{
    const out=await sampleFn.json(prompt,{signal:ctl.signal});
    S.ai={day:n, list:(Array.isArray(out)?out:[]).filter(s=>s&&S.recipes.some(r=>r.id===s.recipeId)).slice(0,3)};
    if(!S.ai.list.length) S.ai.err='Claude fandt ingen oplagte produktioner. Prøv en anden dag.';
  }catch(e){
    S.ai = e.code==='cancelled' ? null : {day:n, err: SCAN_STOP[e.code] || (e.code==='invalid_json'?'Svaret kunne ikke læses. Prøv igen.':'Claude svarede ikke. Prøv igen om lidt.')};
  }
  render();
}

function cartOf(p){
  const items = live().filter(l=>l.producerId===p.id && (S.qty['l:'+l.id]||0)>0).map(l=>({name:l.name+(l.unit?', '+l.unit:''),q:S.qty['l:'+l.id],price:unitPrice(l),offer:true}));
  const prods = shelf().filter(x=>x.producerId===p.id && (S.qty['p:'+x.id]||0)>0).map(x=>({name:x.name+(x.unit?', '+x.unit:''),q:S.qty['p:'+x.id],price:x.price}));
  const lines=[...items,...prods]; return {lines, n:lines.reduce((s,a)=>s+a.q,0), t:r2(lines.reduce((s,a)=>s+a.q*a.price,0))};
}

async function reserve(method){
  const p = prodById(S.sheet.pid);
  if(!S.me) return;
  const wantL = live().filter(l=>l.producerId===p.id && (S.qty['l:'+l.id]||0)>0);
  const wantP = shelf().filter(x=>x.producerId===p.id && (S.qty['p:'+x.id]||0)>0);
  if(!wantL.length && !wantP.length) return;
  S.busy=true; render();
  const c = code(), made=[], payRef='pi_demo_'+Math.random().toString(36).slice(2,10), payNow=new Date().toISOString();
  const pay = () => method ? {payMethod:method, payStatus:'authorized', payRef, authorizedAt:payNow, payFixed:made.length===0} : {};
  try{
    for(const l of wantL){
      const cur=(await db.doc('listings/'+l.id).get()).data(); const q=Math.min(S.qty['l:'+l.id], cur?.qty||0); if(q<=0) continue;
      await db.doc('listings/'+l.id).update({qty:cur.qty-q});
      const price=unitPrice(cur), total=r2(q*price);
      const r={kind:'kortdato',listingId:l.id,producerId:p.id,producerName:p.name,productName:l.name+(l.unit?', '+l.unit:''),qty:q,unitPrice:price,total,fee:r2(total*modelOf(p).share),settle:modelOf(p).key,share:modelOf(p).share,code:c,userId:S.me,status:'reserved',createdAt:new Date().toISOString(),...pay()};
      await db.collection('reservations').add(r); made.push(r);
    }
    for(const x of wantP){
      const cur=(await db.doc('products/'+x.id).get()).data(); const q=Math.min(S.qty['p:'+x.id], cur?.stock||0); if(q<=0) continue;
      await db.doc('products/'+x.id).update({stock:cur.stock-q});
      const total=r2(q*cur.price);
      const r={kind:'fast',productId:x.id,producerId:p.id,producerName:p.name,productName:x.name+(x.unit?', '+x.unit:''),qty:q,unitPrice:cur.price,total,fee:r2(total*modelOf(p).share),settle:modelOf(p).key,share:modelOf(p).share,code:c,userId:S.me,status:'reserved',createdAt:new Date().toISOString(),...pay()};
      await db.collection('reservations').add(r); made.push(r);
    }
    S.qty={}; S.busy=false;
    S.sheet = made.length ? {type:'done',res:made} : null;
    if(!made.length) toast('Varerne blev reserveret af en anden lige før dig.');
  }catch(e){ S.busy=false; if(S.sheet&&S.sheet.type==='pay') S.sheet.step='choose'; toast(e.code==='invalid_argument'?'Du har ikke adgang til at reservere i denne visning.':'Reservationen gik ikke igennem. Intet er trukket. Prøv igen.'); }
  render();
}

function readPhoto(file){
  if(!file) return;
  const fr=new FileReader();
  fr.onload=()=>{ const img=new Image(); img.onload=()=>{
      const shrink=(m)=>{ const k=Math.min(1,m/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height); return c; };
      S.photo=shrink(480).toDataURL('image/jpeg',.72);
      S.rec=null; render();
      shrink(1100).toBlob(bl=>{ S.photoBlob=bl; if(recOn()) recognize(); },'image/jpeg',.85);
    }; img.onerror=()=>toast('Billedet kunne ikke læses.'); img.src=fr.result; };
  fr.readAsDataURL(file);
}

function recStatus(){

  if(!r) return `<span class="muted" style="font-size:14px">Gør klar …</span>`;

  if(r.state==='done') return `<span class="recok">Udfyldt ud fra billedet${r.conf==='lav'?' (usikkert)':''}. Tjek og ret felterne.</span>${r.note?`<span class="muted" style="font-size:13px">${esc(r.note)}</span>`:''}<button class="linkbtn" data-recagain>Genkend igen</button>`;
  if(r.state==='err') return `<span class="muted" style="font-size:14px">${esc(r.msg)}</span>${r.retry?'<button class="linkbtn" data-recagain>Prøv igen</button>':''}`;

async function recognize(){
  if(!recOn() || !S.photoBlob) return;
  const p=myProducer();
  const ctl=new AbortController(); S.rec={state:'busy',ctl}; render();
  const prompt=`Billedet er taget af en lokal fødevareproducent${p?` ("${p.name}", ${catsOf(p).length>1?'kategorier':'kategori'}: ${catsTxt(p)})`:''}, som vil lægge varen i sin webshop.
Identificér varen på billedet, og foreslå produktdata på dansk til shoppen.
Svar KUN med JSON: {"name": kort produktnavn som kunden forstår (fx "Gule løg", "Rugbrød med solsikke", "Lynghonning"), "unit": salgsenhed hvis den kan ses eller er oplagt (fx "1 kg", "500 g", "pr. stk.", "10 stk.") ellers "", "shelf": én af ${JSON.stringify(SHELVES)} (1 Lokal = lokale råvarer og fødevarer; 1 Basis = kolonial; 1 Hjem = husholdning; 1 Krop = personlig pleje), "description": én kort, saglig sætning om varen, kun ud fra det der kan ses, "confidence": "høj", "middel" eller "lav", "note": kort bemærkning hvis noget er uklart, ellers ""}.
Find ikke på mærker, oprindelse, priser eller certificeringer, som ikke tydeligt står på billedet.`;
  try{
    const out=recFn ? await recFn(S.photoBlob,{name:p?p.name:'',cats:p?catsTxt(p):''},ctl.signal) : await sampleFn.json(prompt,{images:[S.photoBlob], signal:ctl.signal});
    if(!out || !out.name) throw {code:'invalid_json'};
    const prev=S.rec&&S.rec.filled||{};
    const setIf=(id,v)=>{ const el=document.getElementById(id); if(!el||!v) return; if(!el.value.trim()||el.value===prev[id]) el.value=v; };
    if(SHELVES.includes(out.shelf)) S.shelf=out.shelf;
    const filled={'p-name':String(out.name).slice(0,80),'p-unit':String(out.unit||'').slice(0,20),'p-desc':String(out.description||'').slice(0,300)};
    const vals={}; ['p-name','p-unit','p-desc','p-price','p-stock'].forEach(id=>{ const el=document.getElementById(id); if(el) vals[id]=el.value; });
    S.rec={state:'done',conf:out.confidence,note:String(out.note||'').slice(0,160),filled};
    render();
    Object.entries(vals).forEach(([id,v])=>{ const el=document.getElementById(id); if(el) el.value=v; });
    Object.entries(filled).forEach(([id,v])=>setIf(id,v));
    updateNet();
  }catch(e){
    if(e&&e.code==='cancelled'){ S.rec={state:'err',msg:'Genkendelse stoppet. Udfyld selv, eller prøv igen.',retry:true}; }
    else if(e&&['not_granted','sampling_disabled','images_unavailable','capability_disabled','capability_removed','not_declared','not_configured'].includes(e.code)){ S.rec={state:'err',msg:'Billedgenkendelse er ikke tilgængelig her. Udfyld felterne selv.'}; }
    else if(e&&e.code==='rate_limited'){ S.rec={state:'err',msg:'Der er taget mange billeder lige nu. Udfyld felterne selv, eller prøv igen om lidt.'}; }
    else S.rec={state:'err',msg:'Varen kunne ikke genkendes. Udfyld selv, eller prøv et skarpere billede.',retry:true};
    const vals={}; ['p-name','p-unit','p-desc','p-price','p-stock'].forEach(id=>{ const el=document.getElementById(id); if(el) vals[id]=el.value; });
    render(); Object.entries(vals).forEach(([id,v])=>{ const el=document.getElementById(id); if(el) el.value=v; });
  }
}

  const inputs = S.pantry.filter(p=>p.qty>0).map(p=>({p, q:num('b-in-'+p.id)})).filter(x=>x.q>0);
  let msg='';
  if(!name) msg='Skriv hvad der skal laves.'; else if(!(yld>0)) msg='Skriv hvor meget det giver.'; else if(!(price>=0)) msg='Skriv en salgspris.'; else if(!inputs.length) msg='Vælg mindst én råvare fra forrådet.';
  else { const over=inputs.find(x=>x.q>x.p.qty); if(over) msg=`Der er kun ${over.p.qty} ${over.p.unit} ${over.p.name}.`; }
  if(msg){ err.textContent=msg; err.hidden=false; return; }
  try{
    await db.collection('batches').add({recipeId:S.bprefill?.recipeId||null, ref:S.bprefill?.ref||null, name, yield:r2(yld), unit, price:r2(price), date:addDays(S.kday), status:'planned', inputs:inputs.map(x=>({pantryId:x.p.id, name:x.p.name, qty:r2(x.q), unit:x.p.unit})), createdAt:new Date().toISOString()});
    S.bform=false; S.bprefill=null; toast('Produktion planlagt'); render();
  }catch(e){ err.textContent='Produktionen kunne ikke gemmes.'; err.hidden=false; }
}
async function batchMade(id){
  const b=S.batches.find(x=>x.id===id); if(!b) return;
  for(const i of b.inputs){ const ref=db.doc('pantry/'+i.pantryId); const cur=(await ref.get()).data(); if(cur) await ref.update({qty:Math.max(0,r2((cur.qty||0)-i.qty))}); }
  await db.doc('batches/'+id).update({status:'made', madeAt:new Date().toISOString()});
  toast('Råvarerne er trukket fra forrådet');
}
async function batchSell(id){
  const b=S.batches.find(x=>x.id===id); if(!b) return;
  if(!prodById(KITCHEN_ID)) await db.doc('producers/'+KITCHEN_ID).set({name:'Isakram-køkkenet', category:'Andet', town:'Storvorde', story:'Det, ingen nåede at hente, laver vi til mad på Aagade 30.', lat:SHOP.lat, lng:SHOP.lng, address:'Aagade 30, 9280 Storvorde', status:'approved', ownerId:'isakram', createdAt:new Date().toISOString()});
  await db.collection('products').add({producerId:KITCHEN_ID, producerName:'Isakram-køkkenet', name:b.name, unit:b.unit, price:b.price, stock:Math.floor(b.yield), shelf:'1 Lokal', description:'Lavet af '+b.inputs.map(i=>i.name).join(', ')+'.', image:null, inBox:true, paused:false, status:'approved', batchId:id, createdAt:new Date().toISOString()});
  await db.doc('batches/'+id).update({status:'sold'});
  toast('På hylden hos Isakram-køkkenet');
}

async function bump(id,delta){ const cur=(await db.doc('products/'+id).get()).data(); if(!cur) return; await db.doc('products/'+id).update({stock:Math.max(0,(cur.stock||0)+delta)}); }

document.addEventListener('click', async e=>{
  if(e.target.closest('#mapedit')){ const svg=$('#mapedit'), r=svg.getBoundingClientRect(); S.pin={x:Math.round((e.clientX-r.left)/r.width*100), y:Math.min(98,Math.round((e.clientY-r.top)/r.height*100)+4)}; render(); return; }
  const t = e.target.closest('button,[data-pid],[data-scrim]');
  if(!t) return;
  const d=t.dataset;
  if(d.role){ S.role=d.role; S.sheet=null; render(); return; }
  if(t.matches('[data-scrim]') && e.target===t){ S.sheet=null; S.qty={}; render(); return; }
  if(d.x!==undefined){ S.sheet=null; S.qty={}; render(); return; }
  if(d.open||d.pid){ S.sheet={type:'producer',pid:d.open||d.pid}; S.qty={}; render(); return; }
  if(d.inc){ S.qty[d.inc]=Math.min(+d.max,(S.qty[d.inc]||0)+1); render(); return; }
  if(d.dec){ S.qty[d.dec]=Math.max(0,(S.qty[d.dec]||0)-1); render(); return; }
  if(d.ptab){ S.ptab=d.ptab; render(); return; }
  if(d.paym){ S.sheet.method=d.paym; render(); return; }
  if(d.payback!==undefined){ if(S.sheet.step&&S.sheet.step!=='choose'){ S.sheet.step='choose'; } else S.sheet={type:'producer',pid:S.sheet.pid}; render(); return; }
  if(d.paygo!==undefined){ S.sheet.step = (S.sheet.method||'mobilepay')==='card' ? 'card' : 'approve'; render(); return; }
  if(d.paycancel!==undefined){ S.sheet.step='choose'; toast('Betalingen blev afvist. Intet er trukket.'); render(); return; }
  if(d.payok!==undefined){ const m=S.sheet.method||'mobilepay'; S.sheet.step='busy'; render(); setTimeout(()=>reserve(m),700); return; }
  if(d.settle){ const p=myProducer(); if(p&&modelOf(p).key!==d.settle){ db.doc('producers/'+p.id).update({settle:d.settle}).then(()=>toast(`${MODELS[d.settle].name} gælder nu for nye salg`)); } return; }
  if(d.porun){ runPayouts(d.porun); return; }
  if(d.bilag){ S.sheet={type:'bilag',id:d.bilag}; render(); return; }
  if(d.shelf){ S.shelf=d.shelf; render(); return; }
  if(d.cat){ S.cat=d.cat; render(); return; }
  if(d.exp!==undefined){ S.exp=+d.exp; render(); return; }
  if(d.pcancel!==undefined){ S.rec?.ctl?.abort(); S.pform=false; S.photo=null; S.photoBlob=null; S.rec=null; render(); return; }
  if(d.recagain!==undefined){ recognize(); return; }
  if(d.recstop!==undefined){ S.rec?.ctl?.abort(); return; }
  if(d.plan){ planFromRecipe(d.plan, Number(d.scale)||1); return; }
  if(d.ai!==undefined){ askChef(); return; }
  if(d.aistop!==undefined){ S.ai?.ctl?.abort(); return; }
  if(d.scan!==undefined){ scanBook(); return; }
  if(d.scanstop!==undefined){ S.scan?.ctl?.abort(); S.scan.msg='stopper efter denne bid …'; render(); return; }
  if(d.bdel){ S.delBook=d.bdel; render(); return; }
  if(d.bdelno!==undefined){ S.delBook=null; render(); return; }
  if(d.bdelok){ deleteBook(d.bdelok); return; }
  if(d.radius!==undefined){ S.radius=+d.radius; render(); return; }
  if(d.sufind!==undefined){ suFind(); return; }
  if(d.sutry){ suFind(d.sutry); return; }
  if(d.sumanual!==undefined){ S.su.manual=true; S.su.co=null; S.su.notFound=false; render(); return; }
  if(d.sunext!==undefined){ suNext(); return; }
  if(d.suback!==undefined){ suCollect(); S.su.err=null; S.su.step=Math.max(1,S.su.step-1); render(); return; }
  if(d.susend!==undefined){ suSend(); return; }
  if(d.suverify!==undefined){ suVerify(); return; }
  if(d.sucat){ suCollect(); const su=S.su, c=d.sucat; su.cats=su.cats.includes(c)?su.cats.filter(x=>x!==c):[...su.cats,c]; if(!su.cats.includes(su.cat)) su.cat=su.cats[0]||null; su.err=null; render(); return; }
  if(d.sumodel){ suCollect(); S.su.settle=d.sumodel; render(); return; }
  if(d.suprim){ suCollect(); S.su.cat=d.suprim; render(); return; }
  if(d.fcat!==undefined){ S.fcat=d.fcat; render(); return; }
  if(d.atab){ S.atab=d.atab; render(); return; }
  if(d.ctype){ S.ctype=d.ctype; render(); return; }
  if(d.kday!==undefined){ S.kday=+d.kday; render(); return; }
  if(d.bnew!==undefined){ S.bprefill=null; S._prefill=true; S.bform=true; render(); document.getElementById('b-name')?.focus(); return; }
  if(d.bcancel!==undefined){ S.bform=false; S.bprefill=null; render(); return; }
  if(d.pantrynew!==undefined){ S.pform2=!S.pform2; render(); return; }
  if(d.tokd){ S.fromProduct=d.tokd; S.ptab='kortdato'; S._prefill=true; render(); return; }
  switch(t.id){
    case 'reserve': reserve(); return;
    case 'topay': if(S.sheet&&S.sheet.pid) S.sheet={type:'pay',pid:S.sheet.pid,method:'mobilepay',step:'choose'}; render(); return;
    case 'po-save': savePayout(); return;
    case 'f-last': S.onlyLast=!S.onlyLast; render(); return;
    case 's-send': signup(); return;
    case 'l-add': addListing(); return;
    case 'p-new': S.pform=true; S.photo=null; S.photoBlob=null; S.rec=null; render(); document.getElementById('p-name')?.focus(); return;
    case 'p-save': saveProduct(); return;
    case 'd-refresh': refreshDemo(); return;
    case 'f-save': savePantry(); return;
    case 'b-save': saveBatch(); return;
  }
  try{
    if(d.pick){ const r=S.reservations.find(x=>x.id===d.pick); const up={status:'picked', pickedAt:new Date().toISOString()}; if(r&&r.payMethod){ up.payStatus='captured'; up.capturedAt=up.pickedAt; up.payFee=payFeeOf(r); } await db.doc('reservations/'+d.pick).update(up); toast(r&&r.payMethod?`Udleveret. ${kr(r.total)} er trukket.`:'Markeret som udleveret'); }
    else if(d.noshow){ await releaseRes(d.noshow,'noshow'); toast('Markeret som ikke hentet. Beløbet er frigivet, og varen er tilbage på hylden.'); }
    else if(d.rcancel){ const r=S.reservations.find(x=>x.id===d.rcancel); if(r) for(const x of S.reservations.filter(y=>y.code===r.code&&y.userId===S.me&&y.status==='reserved')) await releaseRes(x.id,'cancelled'); toast('Reservationen er annulleret, og beløbet er frigivet.'); }
    else if(d.del){ await db.doc('listings/'+d.del).update({status:'removed'}); toast('Fjernet fra kortet'); }
    else if(d.mycat||d.myprim){ const p=myProducer(); if(!p) return; let cs=catsOf(p), prim=catOf(p);
      if(d.mycat){ cs=cs.includes(d.mycat)?cs.filter(x=>x!==d.mycat):[...cs,d.mycat]; if(!cs.length){ toast('Vælg mindst én kategori'); return; } if(!cs.includes(prim)) prim=cs[0]; } else prim=d.myprim;
      await db.doc('producers/'+p.id).update({categories:cs, category:prim}); toast('Kategorier gemt'); }
    else if(d.ok){ await db.doc('producers/'+d.ok).update({status:'approved'}); toast('Producentens butik er åbnet'); }
    else if(d.rej){ await db.doc('producers/'+d.rej).update({status:'rejected'}); toast('Ansøgningen er afvist'); }
    else if(d.pok){ await db.doc('products/'+d.pok).update({status:'approved'}); toast('Produktet er på hylden'); }
    else if(d.prej){ await db.doc('products/'+d.prej).update({status:'rejected'}); toast('Produktet er afvist'); }
    else if(d.pause){ const x=productById(d.pause); await db.doc('products/'+d.pause).update({paused:!x.paused}); toast(x.paused?'Tilbage på hylden':'Sat på pause'); }
    else if(d.sinc){ await bump(d.sinc,1); }
    else if(d.sdec){ await bump(d.sdec,-1); }
    else if(d.kitchen){ const l=S.listings.find(x=>x.id===d.kitchen); await db.doc('listings/'+d.kitchen).update({qty:0, status:'kitchen'}); if(l) await db.collection('pantry').add({name:l.name+(l.unit?', '+l.unit:''), qty:l.qty, unit:'stk.', bestBefore:addDays(2), source:'Tilbud fra '+l.producerName, listingId:l.id, createdAt:new Date().toISOString()}); toast('Lagt i forrådet'); }
    else if(d.finc||d.fdec){ const id=d.finc||d.fdec; const cur=(await db.doc('pantry/'+id).get()).data(); if(cur) await db.doc('pantry/'+id).update({qty:Math.max(0,r2((cur.qty||0)+(d.finc?1:-1)))}); }
    else if(d.bmade){ await batchMade(d.bmade); }
    else if(d.bsell){ await batchSell(d.bsell); }
  }catch(err){ toast('Ændringen kunne ikke gemmes.'); }
});
document.addEventListener('change', e=>{
  const id=e.target.id;
  if(id==='act'){ S.acting=e.target.value||null; S.ptab='overblik'; S.pform=false; if(hasShop()) S.role='shop'; else if(S.role==='shop') S.role='producent'; render(); }
  else if(id==='l-kitchen'){ S.kitchen=e.target.checked; }
  else if(id==='p-box'){ S.inBox=e.target.checked; }
  else if(id==='p-photo'||id==='p-gallery'){ readPhoto(e.target.files[0]); }
  else if(id==='k-rate'){ S.sellRate=(+e.target.value)/100; render(); }
  else if(id==='k-pdf'){ const f=e.target.files[0]; if(f){ S.bookFile=f; S.bookTitle=f.name.replace(/\.pdf$/i,'').replace(/[_-]+/g,' ').trim(); render(); } }
  else if(id==='k-title'){ S.bookTitle=e.target.value.trim(); render(); }
  else if(id==='pos'){ const t=TOWNS.find(x=>x[0]===e.target.value); if(t){ S.myPos={name:t[0],lat:t[1],lng:t[2]}; render(); } }
  else if(id==='s-accept'&&S.su){ S.su.accept=e.target.checked; }
  else if(id==='c-prod'){ S.cprod=e.target.value; render(); }
  else if(id==='l-from'){ S.fromProduct=e.target.value||null; S._prefill=true; render(); }
});
document.addEventListener('input', e=>{ const id=e.target.id; if(id&&id.startsWith('s-')&&S.su){ suCollect(); return; } if(id==='p-price') updateNet(); else if(id==='c-q'){ S.cq=e.target.value; render(); } else if(id==='k-rate'){ const o=document.getElementById('k-rate-v'); if(o) o.textContent=e.target.value+' %'; } });
document.addEventListener('keydown', e=>{ if(e.key==='Enter' && e.target.id==='s-cvr'){ e.preventDefault(); suFind(); return; } if(e.key==='Enter' && e.target.id==='s-code'){ e.preventDefault(); suVerify(); return; } if((e.key==='Enter'||e.key===' ') && e.target.matches('.pin')){ e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click',{bubbles:true})); } if(e.key==='Escape'&&S.sheet){ S.sheet=null; render(); } });

/* ---------- boot ---------- */
render();
(async()=>{
  if(!window.claude?.use){ showNotice('Åbn siden på claude.ai for at se live data.'); return; }
  [db,user,sampleFn] = await Promise.all([claude.use('db'), claude.use('user'), claude.use('sample')]);
  if(!db){ showNotice('Databasen er ikke tilgængelig i denne visning. Log ind på claude.ai for at bruge appen.'); S.ready=true; render(); return; }
  if(user){ S.me = await user.id(); const adm = await user.canEdit(); if(!adm){ $('#r-admin').hidden=true; if(S.role==='admin'){ S.role='kunde'; render(); } } }
  const sub = (col,key) => db.collection(col).onSnapshot(s=>{ S[key]=s.docs.map(d=>({id:d.id,...d.data()})); S.ready=true; render(); }, ()=>showNotice('Forbindelsen til databasen blev afbrudt. Genindlæs siden.'));
  sub('producers','producers'); sub('listings','listings'); sub('products','products'); sub('reservations','reservations'); sub('pantry','pantry'); sub('batches','batches'); sub('books','books'); sub('recipes','recipes'); sub('payouts','payouts');
})();
function showNotice(t){ const n=$('#notice'); n.textContent=t; n.hidden=false; }
})();
</script>
